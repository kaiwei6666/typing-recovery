name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and detection (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Core regression tests
        run: npm test
      - name: Whole-input detection evaluation
        run: node scripts/evaluate-detector.cjs
      - name: Mixed-range evaluation
        run: node scripts/evaluate-ranges.cjs

  browser:
    name: Chromium extension integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Test actual extension in Chromium
        run: python -u tests/browser_smoke.py
