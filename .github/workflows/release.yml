name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify-and-release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core and detection tests
        run: |
          node --test tests/recovery.test.cjs
          node scripts/evaluate-detector.cjs
          node scripts/evaluate-ranges.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test actual extension in Chromium
        run: python -u tests/browser_smoke.py
      - name: Build and verify release archive
        run: python scripts/package-release.py --tag "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            v0.*|*-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Typing Recovery ${GITHUB_REF_NAME}" \
            --verify-tag \
            --fail-on-no-commits \
            --notes "下載 typing-recovery ZIP 並解壓縮，再到 chrome://extensions/ 啟用開發人員模式並載入未封裝項目。完整操作與限制請見 README。" \
            --generate-notes ${prerelease}
